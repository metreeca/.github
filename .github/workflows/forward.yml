name: Forward

on:

  workflow_call:
    inputs:
      project-url:
        description: Target project URL
        type: string
        required: true

jobs:

  forward:

    # Dependabot runs get no Actions secrets, so the app token cannot be minted for its pull requests
    #
    # Transfers are skipped: the issue no longer exists in the source, and the destination forwards it when opened
    if: github.actor != 'dependabot[bot]' && github.event.action != 'transferred'

    runs-on: ubuntu-latest

    steps:

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FORWARD_APP_ID }}
          private-key: ${{ secrets.FORWARD_APP_KEY }}
          owner: metreeca

      - name: Forward to project
        uses: actions/add-to-project@v2
        with:
          project-url: ${{ inputs.project-url }}
          github-token: ${{ steps.app-token.outputs.token }}
